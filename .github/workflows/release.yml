name: Release

# Push a tag like v0.1.0 to build, (optionally) sign and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --release -p calamansi-win -p calamansi-cli
      - name: Stage files
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/Calamansi.exe, target/release/calamansi-cli.exe, LICENSE, THIRD_PARTY_NOTICES.md dist/
          Copy-Item "docs/START-HERE.txt" "dist/START HERE.txt"
          # Fail the release if the exe still needs the Visual C++ runtime DLLs.
          $dumpbin = Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like '*Hostx64\x64*' } | Select-Object -First 1
          if ($dumpbin) {
            $deps = (& $dumpbin.FullName /dependents dist/Calamansi.exe) -join "`n"
            if ($deps -match 'VCRUNTIME|MSVCP') { throw "Calamansi.exe depends on the VC++ runtime:`n$deps" }
            Write-Host $deps
          } else {
            Write-Warning "dumpbin not found; skipped the runtime dependency check"
          }
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: dist/

  # Free code signing for open-source projects via SignPath Foundation.
  # Runs only once the project has been accepted and these are configured:
  #   secret SIGNPATH_API_TOKEN, variables SIGNPATH_ORGANIZATION_ID and SIGNPATH_PROJECT_SLUG.
  sign:
    needs: build
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - uses: actions/upload-artifact@v4
        with:
          name: signed
          path: signed/

  publish:
    needs: [build, sign]
    if: ${{ always() && needs.build.result == 'success' && needs.sign.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Pick signed build if available
        run: |
          if [ -d artifacts/signed ]; then src=artifacts/signed; else src=artifacts/unsigned; fi
          mkdir Calamansi && cp -r "$src"/* Calamansi/
          zip -r "Calamansi-${GITHUB_REF_NAME}-windows-x64.zip" Calamansi
          sha256sum Calamansi-*.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
          files: |
            Calamansi-*.zip
            SHA256SUMS.txt
