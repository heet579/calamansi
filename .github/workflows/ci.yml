name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (build, lint, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install FFmpeg (for media tests)
        run: choco install ffmpeg -y --no-progress
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p calamansi-win -p calamansi-cli
      - uses: actions/upload-artifact@v4
        with:
          name: calamansi-windows-x64
          path: |
            target/release/Calamansi.exe
            target/release/calamansi-cli.exe

  linux:
    name: Linux (engine tests, Windows type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo test -p calamansi-core -p calamansi-cli
      # The Windows app can't link on Linux, but it type-checks, which lets
      # contributors without a Windows machine catch most mistakes.
      - run: cargo clippy -p calamansi-win -- -D warnings
