[workspace]
resolver = "2"
members = ["crates/calamansi-core", "crates/calamansi-cli", "crates/calamansi-win"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/heet579/calamansi"
authors = ["Heet Patel and Calamansi contributors"]
rust-version = "1.92"

[workspace.dependencies]
calamansi-core = { path = "crates/calamansi-core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "webp", "gif", "ico"] }
lopdf = "0.45"
hayro = "0.8"
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.11"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
